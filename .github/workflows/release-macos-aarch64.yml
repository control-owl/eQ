name: Release macOS x86_64

on:
  workflow_run:
    workflows: ["Verify GPG Signature"]
    types:
      - completed
    branches: ["stable"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  standard:
    name: ${{ matrix.features }}-${{ matrix.target }}
    runs-on: macos-latest

    strategy:
      matrix:
        target: [x86_64-apple-darwin]
        features: ["default", "osk"]
      fail-fast: false

    env:
      APP_NAME: "eQ"
      APP_PATH: "target/${{ matrix.target }}/release"
      OUTPUT_DIR: "LAB7041/${{ matrix.target }}"
      CHANGELOG: "doc/changelog.md"

    steps:
      - name: Install system dependencies
        run: |
          brew update
          brew install pkg-config

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
          components: clippy rustfmt

      - name: Check code
        run: |
          cargo fmt --
          cargo clippy --no-deps --verbose --locked --features "${{ matrix.features }}" --target ${{ matrix.target }} -- -D warnings

      - name: Build project
        run: |
          echo "Building with features: ${{ matrix.features }}"
          cargo build --release --verbose --locked --target ${{ matrix.target }} --features "${{ matrix.features }}"

      - name: Test project
        run: |
          cargo test --release --locked --verbose --no-fail-fast --target ${{ matrix.target }} --features "${{ matrix.features }}"

      - id: extract_version
        name: Extract version number
        run: |
          set -euo pipefail
          VERSION_NUMBER=$(head -n 1 "${{ env.CHANGELOG }}" | cut -d ':' -f 2- | tr -d ' #version' | xargs)

          if [[ ! "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: VERSION_NUMBER is not in valid format: ${VERSION_NUMBER}"
            echo "Expected format: 1.2.3"
            exit 1
          fi

          echo "VERSION_NUMBER=${VERSION_NUMBER}" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          set -euo pipefail
          git config user.name "${{ env.APP_NAME }}"
          git config user.email "${{ secrets.ACTIONS_EMAIL }}"
          VERSION="v${{ steps.extract_version.outputs.VERSION_NUMBER }}"

          echo "Checking if tag $VERSION exists..."

          if [ -n "$(git ls-remote --tags origin "$VERSION")" ]; then
            echo "Tag $VERSION already exists on remote, skipping."
          else
            echo "Tag $VERSION does not exist on remote. Creating new signed tag."

            if ! git tag -a "$VERSION" -m "Release $VERSION"; then
              echo "GPG signing or tag creation failed"
              exit 1
            fi

            if ! git push origin "$VERSION"; then
              echo "Tag push failed"
              exit 1
            fi

            echo "Tag $VERSION created successfully."
          fi

      - id: prepare_release
        name: Prepare release files
        run: |
          set -euo pipefail

          BIN_DIR="target/${{ matrix.target }}/release"
          APP_NAME="${{ env.APP_NAME }}"
          FEATURES="${{ matrix.features }}"
          VERSION="${{ steps.extract_version.outputs.VERSION_NUMBER }}"
          OUTPUT_DIR="${{ env.OUTPUT_DIR }}"
          TARGET="${{ matrix.target }}"
          BIN_FILE="${APP_NAME}"
          OUTPUT_BIN="${APP_NAME}-${VERSION}"
          TAR_FILE="${APP_NAME}-${VERSION}-${FEATURES}-macOS.tar.gz"

          if [ ! -f "${BIN_DIR}/${BIN_FILE}" ]; then
            echo "Error: binary ${BIN_DIR}/${BIN_FILE} not found"
            exit 1
          fi

          strip "${BIN_DIR}/${BIN_FILE}" || true

          mkdir -p "${OUTPUT_DIR}"
          cp "${BIN_DIR}/${BIN_FILE}" "${OUTPUT_DIR}/${OUTPUT_BIN}"
          cp "${{ env.CHANGELOG }}" "${OUTPUT_DIR}/changelog.md"
          cp LICENSE "${OUTPUT_DIR}/LICENSE"

          tar -czf "${OUTPUT_DIR}/${TAR_FILE}" \
            -C "${OUTPUT_DIR}" "${OUTPUT_BIN}" \
            -C "${OUTPUT_DIR}" "changelog.md" \
            -C "${OUTPUT_DIR}" "LICENSE"

          echo "TAR_FILE=${TAR_FILE}" >> $GITHUB_OUTPUT
          echo "Release files prepared"

      - name: Generate SHA256 checksum
        run: |
          set -euo pipefail
          TAR="${{ env.OUTPUT_DIR }}/${{ steps.prepare_release.outputs.TAR_FILE }}"
          if [ ! -f "${TAR}" ]; then
            echo "Error: ${TAR} not found"
            exit 1
          fi
          shasum -a 256 "${TAR}" > "${TAR}.sha256"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ env.OUTPUT_DIR }}/${{ steps.prepare_release.outputs.TAR_FILE }}
            ${{ env.OUTPUT_DIR }}/${{ steps.prepare_release.outputs.TAR_FILE }}.sha256
            ${{ env.CHANGELOG }}
            LICENSE
          draft: false
          prerelease: true
          tag_name: v${{ steps.extract_version.outputs.VERSION_NUMBER }}
