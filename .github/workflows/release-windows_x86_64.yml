name: Release Windows x86_64

on:
  workflow_run:
    workflows: ["Verify GPG Signature"]
    types:
      - completed
    branches: ["stable"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  standard:
    name: ${{ matrix.features }}-${{ matrix.target }}
    runs-on: windows-latest

    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
        features: ["default", "osk"]
      fail-fast: false

    env:
      APP_NAME: "eQ"
      APP_PATH: "target/${{ matrix.target }}/release"
      OUTPUT_DIR: "LAB7041/${{ matrix.target }}"
      CHANGELOG: "doc/changelog.md"

    steps:
      - name: Install system dependencies
        shell: pwsh
        run: |
          choco install llvm -y

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
          components: clippy rustfmt

      - name: Check code
        shell: pwsh
        run: |
          cargo fmt --
          cargo clippy --no-deps --verbose --locked --features "${{ matrix.features }}" --target ${{ matrix.target }} -- -D warnings

      - name: Build project
        shell: pwsh
        run: |
          Write-Host "Building with features: ${{ matrix.features }}"
          cargo build --release --verbose --locked --target ${{ matrix.target }} --features "${{ matrix.features }}"

      - name: Test project
        shell: pwsh
        run: |
          cargo test --release --locked --verbose --no-fail-fast --target ${{ matrix.target }} --features "${{ matrix.features }}"

      - id: extract_version
        name: Extract version number
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $line = (Get-Content "${{ env.CHANGELOG }}" | Where-Object { $_.Trim() -ne "" } | Select-Object -First 1).Trim()
          if (-not $line) {
            Write-Error "CHANGELOG first non-empty line is empty or unreadable"
            exit 1
          }

          $clean = $line -replace '^#', '' -replace 'version', '' -replace ':', ''
          $version = $clean.Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "VERSION_NUMBER invalid: $version"
            exit 1
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "VERSION_NUMBER=$version"

      - name: Create tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "${{ env.APP_NAME }}"
          git config user.email "${{ secrets.ACTIONS_EMAIL }}"
          $VERSION = "v${{ steps.extract_version.outputs.VERSION_NUMBER }}"

          Write-Host "Checking if tag $VERSION exists..."

          if (git ls-remote --tags origin $VERSION) {
            Write-Host "Tag exists, skipping."
          } else {
            Write-Host "Creating signed tag $VERSION"
            if (-not (git tag -a $VERSION -m "Release $VERSION")) {
              Write-Error "GPG signing or tag creation failed"
              exit 1
            }
            if (-not (git push origin $VERSION)) {
              Write-Error "Tag push failed"
              exit 1
            }
            Write-Host "Tag $VERSION created successfully."
          }

      - id: prepare_release
        name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $BIN_DIR = "target/${{ matrix.target }}/release"
          $APP_NAME = "${{ env.APP_NAME }}"
          $FEATURES = "${{ matrix.features }}"
          $VERSION = "${{ steps.extract_version.outputs.VERSION_NUMBER }}"
          $OUTPUT_DIR = "${{ env.OUTPUT_DIR }}"
          $ROOT = $env:GITHUB_WORKSPACE
          $BIN_FILE = "$APP_NAME.exe"
          $OUTPUT_BIN = "$APP_NAME-$VERSION.exe"
          $ZIP_FILE = "$APP_NAME-$VERSION-$FEATURES-Windows.zip"

          if (-not (Test-Path -Path (Join-Path $BIN_DIR $BIN_FILE))) {
            Write-Error "Binary not found: $BIN_DIR\$BIN_FILE"
            exit 1
          }

          try {
            llvm-strip (Join-Path $BIN_DIR $BIN_FILE)
          } catch {
            Write-Warning "llvm-strip failed or not available; continuing"
          }

          New-Item -ItemType Directory -Force -Path $OUTPUT_DIR | Out-Null
          # Copy binary
          Copy-Item -Path (Join-Path $BIN_DIR $BIN_FILE) -Destination (Join-Path $OUTPUT_DIR $OUTPUT_BIN) -Force
          Copy-Item -Path (Join-Path $ROOT "${{ env.CHANGELOG }}") -Destination (Join-Path $OUTPUT_DIR "changelog.md") -Force
          Copy-Item -Path (Join-Path $ROOT "LICENSE") -Destination (Join-Path $OUTPUT_DIR "LICENSE") -Force

          $filesToZip = @(
            (Join-Path $OUTPUT_DIR $OUTPUT_BIN),
            (Join-Path $OUTPUT_DIR "changelog.md"),
            (Join-Path $OUTPUT_DIR "LICENSE")
          )

          $zipPath = Join-Path $OUTPUT_DIR $ZIP_FILE
          if (Test-Path -Path $zipPath) { Remove-Item -Path $zipPath -Force }

          Compress-Archive -Path $filesToZip -DestinationPath $zipPath -Force

          Add-Content -Path $env:GITHUB_OUTPUT -Value "ZIP_FILE=$ZIP_FILE"
          Write-Host "Prepared $ZIP_FILE in $OUTPUT_DIR"

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipPath = Join-Path "${{ env.OUTPUT_DIR }}" "${{ steps.prepare_release.outputs.ZIP_FILE }}"
          if (-not (Test-Path -Path $zipPath)) {
            Write-Error "Zip file not found: $zipPath"
            exit 1
          }

          $hashOutput = CertUtil -hashfile $zipPath SHA256
          $hashLine = ($hashOutput | Where-Object { $_ -match '^[0-9A-Fa-f ]+$' } | Select-Object -First 1).Trim()
          if ($hashLine) {
            $hashLine | Out-File -FilePath "$zipPath.sha256" -Encoding ascii
          } else {
            $hashOutput | Out-File -FilePath "$zipPath.sha256" -Encoding ascii
          }

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ env.OUTPUT_DIR }}/${{ steps.prepare_release.outputs.ZIP_FILE }}
            ${{ env.OUTPUT_DIR }}/${{ steps.prepare_release.outputs.ZIP_FILE }}.sha256
            ${{ env.CHANGELOG }}
            LICENSE
          draft: false
          prerelease: true
          tag_name: v${{ steps.extract_version.outputs.VERSION_NUMBER }}
