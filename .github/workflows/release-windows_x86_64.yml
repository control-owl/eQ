name: Release Windows x86_64

on:
  workflow_run:
    workflows: [ "Verify GPG Signature" ]
    types:
      - completed
    branches: [ "stable" ]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  standard:
    name: ${{ matrix.features }}-${{ matrix.target }}
    runs-on: windows-latest

    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
        features: ["default"] #, "dev"
      fail-fast: false

    env:
      APP_NAME: "eQ"
      APP_PATH: "target/${{ matrix.target }}/release"
      OUTPUT_DIR: "LAB7041/${{ matrix.target }}"

    steps:
      - name: Install system dependencies
        shell: pwsh
        run: |
          choco install llvm -y

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy rustfmt

      - name: Check code
        shell: pwsh
        run: |
          cargo fmt --
          cargo clippy --no-deps --verbose --locked --features "${{ matrix.features }}" --target ${{ matrix.target }} -- -D warnings

      - name: Build project
        shell: pwsh
        run: |
          Write-Host "Building with features: ${{ matrix.features }}"
          cargo build --release --verbose --locked --target ${{ matrix.target }} --features "${{ matrix.features }}"

      - name: Test project
        shell: pwsh
        run: cargo test --release --locked --verbose --no-fail-fast --target ${{ matrix.target }} --features "${{ matrix.features }}"

      - name: Extract version number
        shell: pwsh
        run: |
          $line = Get-Content Changelog.md -TotalCount 1
          $version = $line.Split(':')[1].Trim().Replace('#version','').Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "VERSION_NUMBER invalid: $version"
            exit 1
          }

          Add-Content -Path $env:GITHUB_ENV -Value "VERSION_NUMBER=$version"

      - name: Create tag
        shell: pwsh
        run: |
          git config user.name "${{ env.APP_NAME }}"
          git config user.email "${{ secrets.ACTIONS_EMAIL }}"
          $VERSION = "v${{ env.VERSION_NUMBER }}"

          Write-Host "Checking if tag $VERSION exists..."

          if (git ls-remote --tags origin $VERSION) {
            Write-Host "Tag exists, skipping."
          } else {
            Write-Host "Creating signed tag $VERSION"
            git tag -a $VERSION -m "Release $VERSION"
            git push origin $VERSION
          }

      - name: Prepare release files
        shell: pwsh
        run: |
          $BIN_DIR = "target/${{ matrix.target }}/release"
          $APP_NAME = "${{ env.APP_NAME }}"
          $FEATURES = "${{ matrix.features }}"
          $VERSION = "${{ env.VERSION_NUMBER }}"
          $OUTPUT_DIR = "${{ env.OUTPUT_DIR }}"
          $TARGET = "${{ matrix.target }}"
          $BIN_FILE = "$APP_NAME.exe"
          $OUTPUT_BIN = "$APP_NAME-$VERSION-$FEATURES.exe"
          $TAR_FILE = "$APP_NAME-$VERSION-$FEATURES-$TARGET.tar.gz"

          llvm-strip "$BIN_DIR/$BIN_FILE"

          New-Item -ItemType Directory -Force -Path $OUTPUT_DIR | Out-Null
          Copy-Item "$BIN_DIR/$BIN_FILE" "$OUTPUT_DIR/$OUTPUT_BIN"

          tar -czf "$OUTPUT_DIR/$TAR_FILE" `
            -C "$OUTPUT_DIR" "$OUTPUT_BIN" `
            -C ../../ Changelog.md LICENSE.txt

          Add-Content -Path $env:GITHUB_ENV -Value "TAR_FILE=$TAR_FILE"

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          CertUtil -hashfile "${{ env.OUTPUT_DIR }}\${{ env.TAR_FILE }}" SHA256 > "${{ env.OUTPUT_DIR }}\${{ env.TAR_FILE }}.sha256"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            ${{ env.OUTPUT_DIR }}/${{ env.TAR_FILE }}
            ${{ env.OUTPUT_DIR }}/${{ env.TAR_FILE }}.sha256
            Changelog.md
            LICENSE.txt
          draft: false
          prerelease: true
          tag_name: v${{ env.VERSION_NUMBER }}
