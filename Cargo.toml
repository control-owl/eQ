[package]
name = "eQ"
description = "Crypto key generator"
version = "1.0.0"
authors = ["Control Owl <eq[at]r-o0-t[dot]wtf>"]
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/control-owl/eQ"
readme = "README.md"
edition = "2024"
build = "build.rs"

# -.-. --- .--. -.-- .-. .. --. .... - / -.-. --- -. - .-. --- .-.. / --- .-- .-..

[dependencies]

# GUI
egui = "0.33.3"
eframe = "0.33.3"
egui_extras = { version = "0.33.3", features = ["svg", "image", "all_loaders"] }
rfd = "0.17.2"
svg = "0.18.0"

# System and environment
sysinfo = "0.38.0"
getrandom = "0.3.4"
include_dir = "0.7.4"

# Crypto primitives and hashing
sha2 = "0.10.9"
sha3 = "0.10.8"
tiny-keccak = { version = "2.0.2", features = ["sha3", "keccak"] }
ripemd = "0.1.3"
ring = "0.17.14"

# Curve libraries
secp256k1 = "0.31.1"
ed25519-dalek = "2.2.0"
curve25519-dalek = "4.1.3"
num-bigint = "0.4.6"

# Encodings and formatting
hex = "0.4.3"
bs58 = "0.5.1"
bech32 = "0.11.1"
base32 = "0.5.1"
base64 = "0.22.1"

# Secrets
shamir_share = "0.2.1"
zeroize = { version = "1.8.2", features = ["derive"] }

# -.-. --- .--. -.-- .-. .. --. .... - / -.-. --- -. - .-. --- .-.. / --- .-- .-..

[features]
default = []
dev = []

# -.-. --- .--. -.-- .-. .. --. .... - / -.-. --- -. - .-. --- .-.. / --- .-- .-..

[[bin]]
name = "eQ"
path = "src/main.rs"

[lib]
name = "e_q"
path = "src/lib.rs"

# -.-. --- .--. -.-- .-. .. --. .... - / -.-. --- -. - .-. --- .-.. / --- .-- .-..

[build-dependencies]
winres = "0.1.12"

[package.metadata.winres]
OriginalFilename = "eQ.EXE"
LegalCopyright = "CC-BY-NC-ND-4.0 (2023-2025) Control Owl"
FileDescription = "Crypto key generator"

[package.metadata.excluded]
exclude = ["build.rs"]

# -.-. --- .--. -.-- .-. .. --. .... - / -.-. --- -. - .-. --- .-.. / --- .-- .-..
